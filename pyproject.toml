[project]
name = "tg-stonks"
version = "0.1.0"
description = ""
authors = [
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "aiogram (>=3.29.1,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
