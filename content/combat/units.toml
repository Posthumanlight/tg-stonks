# Unit types. Stats per docs/combat-ground.md "Units"; hp is per model.
# groups = the loadout: models sharing a role, weapons and hp. Exactly one group has
# fill = true and absorbs unit-size changes. casualty_priority: lowest dies first.

# --- Concord (human) -----------------------------------------------------------------

[units.line_troopers]
name_key = "unit.line_troopers.name"
faction = "concord"
points = 90
speed = 5
movement = 6
hp = 1
armor = "light"
tags = ["infantry", "human"]
action_points = 2
footprint = 1
models = { min = 5, max = 10 }
abilities = ["smoke_charge", "fall_back"]

[[units.line_troopers.groups]]
role = "trooper"
count = 8
fill = true
weapons = ["pulse_rifle", "combat_knife"]
casualty_priority = 0

[[units.line_troopers.groups]]
role = "gunner"
count = 1
weapons = ["rail_lance", "combat_knife"]
casualty_priority = 1

[[units.line_troopers.groups]]
role = "sergeant"
count = 1
hp = 2
weapons = ["sidearm", "shock_maul"]
casualty_priority = 2

